pluginManagement {
    includeBuild('conventions')
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'track-me-platform'

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

include 'platform'
include 'commons'
