plugins {
    id 'io.freefair.lombok' version '8.14' apply false
}

subprojects {
    // Версия по умолчанию задаётся в gradle.properties (X.Y.Z-SNAPSHOT),
    // CI переопределяет её при релизе: ./gradlew publish -Pversion=X.Y.Z
    apply plugin: 'maven-publish'

    publishing {
        repositories {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/Students-buisness-incubator-of-TUSUR/track-me-platform')
                credentials {
                    username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                    password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }

}

// Convention-плагин живёт в included build (conventions/) и не попадает
// в ./gradlew publish — публикуется этими отдельными задачами.
tasks.register('publishConventions') {
    dependsOn gradle.includedBuild('conventions').task(':publish')
}

tasks.register('publishConventionsToMavenLocal') {
    dependsOn gradle.includedBuild('conventions').task(':publishToMavenLocal')
}
