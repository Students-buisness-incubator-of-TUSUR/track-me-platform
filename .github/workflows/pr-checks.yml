name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build and test
        run: ./gradlew build

  publish-snapshot:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'publish-snapshot')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Publish snapshot to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          SNAPSHOT_VERSION="${BASE_VERSION%-SNAPSHOT}-pr${{ github.event.pull_request.number }}-SNAPSHOT"
          echo "Publishing version $SNAPSHOT_VERSION"
          ./gradlew publish publishConventions -Pversion="$SNAPSHOT_VERSION"
